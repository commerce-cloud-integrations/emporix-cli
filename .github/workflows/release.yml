name: release

# A pushed vMAJOR.MINOR.PATCH tag releases epx: the GitHub release (archives, checksums
# and installers), then the npm package @commercecloudintegrations/epx-cli through npm's
# trusted publishing (OIDC: no npm token is stored, and npm records the provenance).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The npm trusted publisher names this environment.
    environment: release
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Trusted publishing needs npm 11.5.1 or later, which Node.js 24 ships.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Test
        run: go test ./...

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release.sh --publish

      - name: npm
        run: .github/scripts/npm.sh "dist/$GITHUB_REF_NAME" --publish
