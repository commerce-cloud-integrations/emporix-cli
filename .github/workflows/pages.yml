name: pages

# Publishes the documentation site (site/) on GitHub Pages for every pushed
# vMAJOR.MINOR.PATCH tag, so the site describes the latest release; run it by hand
# (workflow_dispatch) to republish a tag or main. The build is static: a Mintlify export,
# rewritten for the base path /emporix-cli, with a Pagefind search index
# (.github/scripts/site/build.sh).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Exact versions: the build rewrites the export's paths and payloads, so a new
      # Mintlify version is adopted only after it was checked.
      - name: Install Mintlify and Pagefind
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/tools" mint@4.2.1042 pagefind@1.5.2

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the site
        env:
          MINT: ${{ runner.temp }}/tools/node_modules/.bin/mint
          PAGEFIND: ${{ runner.temp }}/tools/node_modules/.bin/pagefind
        run: .github/scripts/site/build.sh "$RUNNER_TEMP/site" /emporix-cli

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
